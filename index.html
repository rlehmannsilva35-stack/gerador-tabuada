<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Tabuada</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f4f8;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            color: #0f172a;
            margin-bottom: 10px;
        }

        p.instrucao {
            font-size: 0.95rem;
            color: #475569;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="number"] {
            flex: 1;
            padding: 10px 14px;
            font-size: 1rem;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            border-color: #2563eb;
        }

        button {
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: #2563eb;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .mensagem-erro {
            color: #dc2626;
            font-size: 0.9rem;
            margin-bottom: 15px;
            min-height: 20px;
        }

        .resultado {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            text-align: left;
            display: none;
        }

        .resultado h2 {
            font-size: 1.1rem;
            color: #1e293b;
            margin-bottom: 10px;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 8px;
        }

        .linha-tabuada {
            padding: 6px 10px;
            font-size: 1.05rem;
            border-bottom: 1px dashed #e2e8f0;
            display: flex;
            justify-content: space-between;
        }

        .linha-tabuada:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Gerador de Tabuada</h1>
        <p class="instrucao">Insira um número entre <strong>1 e 10</strong> para gerar a tabuada completa:</p>

        <div class="input-group">
            <input type="number" id="numeroInput" min="1" max="10" placeholder="Ex: 7">
            <button id="btnGerar">Gerar</button>
        </div>

        <div id="mensagemErro" class="mensagem-erro"></div>
        <div id="resultadoTabuada" class="resultado"></div>
    </div>

    <script>
        const numeroInput = document.getElementById('numeroInput');
        const btnGerar = document.getElementById('btnGerar');
        const mensagemErro = document.getElementById('mensagemErro');
        const resultadoTabuada = document.getElementById('resultadoTabuada');

        function gerarTabuada() {
            const valor = numeroInput.value.trim();
            const numero = Number(valor);

            // Limpa mensagens e resultados anteriores antes de gerar uma nova tabuada
            mensagemErro.textContent = '';
            resultadoTabuada.innerHTML = '';

            // Validação para garantir que o número esteja entre 1 e 10
            if (valor === '' || isNaN(numero) || !Number.isInteger(numero) || numero < 1 || numero > 10) {
                mensagemErro.textContent = 'Por favor, insira um número inteiro válido entre 1 e 10.';
                resultadoTabuada.style.display = 'none';
                return;
            }

            // Cabeçalho da tabuada exibida
            const titulo = document.createElement('h2');
            titulo.textContent = `Tabuada do ${numero}`;
            resultadoTabuada.appendChild(titulo);

            // Estrutura de repetição "for" para calcular e exibir cada linha
            for (let i = 1; i <= 10; i++) {
                const produto = numero * i;

                const linha = document.createElement('div');
                linha.className = 'linha-tabuada';
                linha.innerHTML = `<span>${numero} × ${i}</span> <strong>= ${produto}</strong>`;

                resultadoTabuada.appendChild(linha);
            }

            resultadoTabuada.style.display = 'block';
        }

        // Aciona o cálculo ao clicar no botão
        btnGerar.addEventListener('click', gerarTabuada);

        // Permite também acionar pressionando a tecla Enter
        numeroInput.addEventListener('keypress', function (evento) {
            if (evento.key === 'Enter') {
                gerarTabuada();
            }
        });
    </script>
</body>
</html>
